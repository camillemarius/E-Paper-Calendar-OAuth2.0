


<!DOCTYPE html>
<html>
  <head>
    <title>Google Photos Picker</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
  </head>
  <body>
    <button id="signin">Mit Google anmelden</button>
    <button id="pick" disabled>Foto auswählen</button>

    <script>
      const CLIENT_ID = "686461590273-ejdaitfhmb1o15kqfipmsklsvkq3pp6b.apps.googleusercontent.com";
      const SCOPES = 'https://www.googleapis.com/auth/photoslibrary.readonly https://www.googleapis.com/auth/photoslibrary.sharing';
      const CLOUD_RUN_URL = "https://<DEIN_CLOUD_RUN_ENDPOINT>";
      // const API_KEY = 'AIzaSyAwOB6JGgLRTLcQK3DKlysTEUsanp0P1Lk';
      let tokenClient, accessToken;

      window.onload = () => {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: (resp) => {
            accessToken = resp.access_token;
            document.getElementById("pick").disabled = false;
          },
        });

        document.getElementById("signin").onclick = () => {
          tokenClient.requestAccessToken();
        };

        document.getElementById("pick").onclick = openPicker;
      };

      function openPicker() {
        gapi.load("picker", () => {
          const view = new google.picker.View(google.picker.ViewId.PHOTOS);
          const picker = new google.picker.PickerBuilder()
            .setOAuthToken(accessToken)
            .addView(view)
            .setCallback(pickerCallback)
            .build();
          picker.setVisible(true);
        });
      }

      function pickerCallback(data) {
        if (data.action === google.picker.Action.PICKED) {
          const selectedIds = data.docs.map(d => d.id);
          console.log("Ausgewählte Foto-IDs:", selectedIds);

          // IDs an Cloud Run schicken
          fetch(CLOUD_RUN_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ selectedPhotoIds: selectedIds })
          })
          .then(r => {
            if (!r.ok) throw new Error(r.statusText);
            return r.blob();
          })
          .then(imgBlob => {
            const imgUrl = URL.createObjectURL(imgBlob);
            const img = document.createElement("img");
            img.src = imgUrl;
            document.body.appendChild(img);
          })
          .catch(err => console.error("Fehler beim Senden:", err));
        }
      }
    </script>
  </body>
</html>
